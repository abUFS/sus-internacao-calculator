<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {% if title %}
      <title>InternaCalc - {{ title }}</title>
    {% else %}
      <title>InternaCalc</title>
    {% endif %}

    <meta name="description" content="Calculadora de diárias hospitalares por competência (SUS)">
    <meta name="author" content="Artur Barbosa">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Nunito:wght@400;600&display=swap"
          rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          crossorigin="anonymous">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          type="text/css"
          href="{{ url_for('static', path='css/main.css') }}">

    <meta name="theme-color" content="#c76108">
  </head>

  <body class="d-flex flex-column min-vh-100">

    <!-- HEADER -->
    <header class="site-header">
      <nav class="navbar navbar-expand-md fixed-top bg-theme" data-bs-theme="dark">
        <div class="container">
          <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">
            InternaCalc
          </a>

          <button class="navbar-toggler"
                  type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#navbarToggle">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarToggle">
            <div class="navbar-nav me-auto">
              <a class="nav-link active" href="{{ url_for('home') }}">Calculadora</a>
              <a class="nav-link active" href="{{ url_for('info') }}">Info</a>
              <!-- Futuras ferramentas -->
              <!-- <a class="nav-link" href="#">Outra Ferramenta</a> -->
            </div>

            <div class="navbar-nav">
              <span class="nav-link text-light small">
                Sistema de apoio a AIH/SUS
              </span>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <!-- MAIN -->
    <main role="main" class="container main-container">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-7">
          {% block content %}
          {% endblock content %}
        </div>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="mt-auto py-3 footer-theme">
      <div class="container text-center">
        <p class="mb-0 small">
          © <span id="year"></span> CalcAIH.
        </p>
      </div>
    </footer>

    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            crossorigin="anonymous"></script>

  </body>
</html>
